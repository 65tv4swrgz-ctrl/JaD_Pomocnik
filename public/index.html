<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>JaD Pomocník</title>
  <meta name="description" content="Offline příručka a vedení střetnutí pro Jeskyně a draci.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0f14">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JaD Pomocník">

  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#/">
        <img class="brand__logo" src="icons/logo.png" alt="" width="28" height="28">
        <span>JaD Pomocník</span>
      </a>
      <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false" data-nav-toggle>
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" data-nav>
        <a href="#/monsters" data-nav-link="monster">Protivníci</a>
        <a href="#/items" data-nav-link="item">Předměty</a>
        <a href="#/spells" data-nav-link="spell">Kouzla</a>
        <a href="#/encounters" data-nav-link="encounter">Střetnutí</a>
        <a href="#/parties" data-nav-link="part">Družiny</a>
        <a href="#/settings" data-nav-link="settings">Data</a>
      </nav>
    </div>
  </header>

  <div class="update-bar" id="updateBar" hidden>
    Je k dispozici nová verze aplikace.
    <button class="btn btn-sm" type="button" id="updateBtn">Aktualizovat</button>
  </div>

  <main class="container" id="app">
    <div class="loading" id="bootMsg">Načítám databázi…</div>
  </main>

  <div class="toast-wrap" id="toasts" aria-live="polite"></div>

  <footer class="footer">
    JaD Pomocník – offline verze. Údaje převzaty z JaD. Právo na chyby a jiné interpretace faktů vyhrazeno.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
